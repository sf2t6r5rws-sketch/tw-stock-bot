# ================================================================
# 盤後分析設定檔：平常只需要改這個檔案
# 規則：# 後面是說明文字，程式不會讀；冒號後面要空一格
# ================================================================

# ---------- 一、我的帳戶（每次買賣、存入或提領後更新） ----------

cash: 102776           # 投資專戶裡的現金（元）

holdings:              # 目前持股；新買進就照同樣格式往下加
  - code: "2330"       # 股票代號，記得加引號
    name: 台積電
    shares: 1          # 股數（1 張 = 1000 股，零股就填實際股數）
    cost: 2443         # 每股平均成本（含手續費）
    type: core         # core = 核心資產，active = 主動投資

  - code: "2049"
    name: 上銀
    shares: 6
    cost: 336.83       # 實際成本，日報的損益用它計算
    plan_cost: 241.5   # 納入計畫時的價格，計畫規則從這裡開始算（新買的股票不用填）
    type: active
    stop_loss: 205     # 停損價（收盤跌到這裡會通知，隔天手動賣出）
    # target: 300      # 目標價（選填，要用時去掉最前面的 #）
    # 持有理由：營收、營益、EPS 同步成長；美系機器人小型滑軌訂單已出貨
    # 我錯了的條件：核心客戶因品質問題取消訂單／連續兩季營收年減／營益率持續低於 10%／毛利率連續兩季下滑
    # 下次檢查：每月 10 日前後看月營收；下一季財報公布時完整檢查

cash_flows:
  - date: 2026-11-23
    amount: 2776
    note: 出清聯鈞、晶技（計畫外舊持股）

watchlist: []          # 觀察清單：收盤價跌到 buy_below 以下會通知
# 要追蹤時，把上面改成 watchlist: ，再照下面格式往下加：
#  - code: "2886"
#    buy_below: 38
#    note: 等殖利率 6% 以上再研究

# ---------- 二、計畫書規則 ----------

rules:
  drawdown_level1: 10        # 第一級回撤警戒（%）
  drawdown_level2: 20        # 第二級回撤警戒（%）
  active_max_pct: 20         # 主動部位上限（佔總資產 %）
  single_stock_max_pct: 10   # 單一個股上限（佔總資產 %）
  active_loss_alert_pct: 20  # 主動部位相對成本虧損多少 % 要停下來檢討

# ---------- 三、全市場掃描條件 ----------
# 某個條件不想用，就在那一行最前面加 #

scan:
  enabled: true
  include_otc: true          # 是否包含上櫃股票
  include_etf: false         # 是否包含 ETF
  code_prefixes: []          # 只看某類股票，例如只看金融股填 ["28"]
  exclude: []                # 不想看到的代號，例如 ["2330", "2317"]

  # 基本面（用證交所、櫃買中心每天公布的數字）
  min_price: 10              # 股價下限（元）
  max_price: 1000            # 股價上限（元）
  pe_max: 15                 # 本益比上限（虧損公司會自動排除）
  yield_min: 4               # 殖利率下限（%）
  pb_max: 2                  # 股價淨值比上限
  min_volume_lots_today: 300 # 今天成交量至少幾張

  # 技術面（用近 9 個月股價計算）
  above_ma60: true           # 收盤價要在季線（60 日均線）之上
  ma60_rising: true          # 季線要往上彎
  max_above_ma20_pct: 8      # 收盤價離月線最多高幾 %，避免追高
  min_avg_volume_lots_20d: 500  # 近 20 日平均成交量至少幾張

  prefilter_limit: 150       # 基本面初選後最多取幾檔再算技術面
  top_n: 15                  # 通知裡最多列幾檔
